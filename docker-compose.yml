version: "3.8"

services:
  vote:
    image: dockersamples/examplevotingapp_vote:latest
    networks:
      - new_lay
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s

  result:
    image: dockersamples/examplevotingapp_result:latest
    ports:
      - "8081:80"
    networks:
      - new_lay
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  redis:
    image: redis:alpine
    networks:
      - new_lay
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    image: dockersamples/examplevotingapp_worker:latest
    networks:
      - new_lay
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - new_lay
    deploy:
      placement:
        constraints:
          - node.labels.db==true
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    networks:
      - new_lay
    configs:
      - source: nginx_config
        target: /etc/nginx/conf.d/default.conf
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
volumes:
  db-data:
    driver: local

networks:
  new_lay:
    driver: overlay
    external: true

secrets:
  db_password:
    external: true

configs:
  nginx_config:
    file: ./nginx.conf

